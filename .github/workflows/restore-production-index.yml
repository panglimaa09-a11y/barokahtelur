name: Restore last known working index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index from known-good commit
        run: |
          git checkout 845b14fd915d5cbd1b7491fd13977655ac195eb6 -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Index already restored."
          else
            git commit -m "fix: restore known-good Barokah production index"
            git push
          fi
