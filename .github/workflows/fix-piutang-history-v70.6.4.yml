name: Fix V70.6.4 piutang history wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire piutang history module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          src = 'debt-history-sync-v70.6.3.js'
          s = re.sub(r'<script[^>]+src=["\']' + re.escape(src) + r'["\'][^>]*></script>', '', s, flags=re.I)
          pos = s.rfind('</body>')
          if pos < 0:
              raise SystemExit('No document closing body tag')
          tag = f'\n<script src="{src}"></script>\n'
          s = s[:pos] + tag + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(v70.6.4): sync piutang history with cloud data [skip ci]'
          git push origin HEAD:main
