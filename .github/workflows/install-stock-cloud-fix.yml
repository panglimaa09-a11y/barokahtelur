name: Install Barokah production fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject production fix scripts
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="stock-cloud-fix.js"></script>',
              '<script src="ui-bugfix.js"></script>'
          ]
          marker = '</body>'
          if marker not in s:
              raise SystemExit('index.html tidak memiliki </body>')
          changed = False
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
                  changed = True
          # Keep the revision watermark hidden in normal application view.
          css = '<style id="barokah-ui-cleanup-css">.print-demo-watermark,.pr-demo-label{display:none!important}@media print{.print-demo-watermark{display:block!important}.pr-demo-label{display:block!important}}</style>'
          if 'id="barokah-ui-cleanup-css"' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)
              changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Production fixes injected.')
          else:
              print('Production fixes already installed.')

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "fix: remove leaked print code and revision watermark"
            git push
          fi
