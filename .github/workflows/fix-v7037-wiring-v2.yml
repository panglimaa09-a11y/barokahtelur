name: Final clean V70.3.7 script wiring

on:
  push:
    branches: [v70.3.7-utang-piutang]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v70.3.7-utang-piutang
          fetch-depth: 0
      - name: Remove accidental embedded tags and add only to document footer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for name in ['utang-piutang.js','utang-piutang-nota.js']:
              s=re.sub(r'<script src=(?:\\?")'+re.escape(name)+r'(?:\\?")></script>', '', s)
          s=re.sub(r'\n{2,}', '\n\n', s)
          pos=s.rfind('</body>')
          if pos < 0: raise SystemExit('No document closing body tag')
          tags='\n<script src="utang-piutang.js"></script>\n<script src="utang-piutang-nota.js"></script>\n'
          s=s[:pos]+tags+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(v70.3.7): finalize module script wiring [skip ci]'
          git push origin HEAD:v70.3.7-utang-piutang
