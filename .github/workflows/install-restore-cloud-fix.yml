name: Install restore cloud fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject restore cloud fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="restore-cloud-fix.js"></script>'
          s = s.replace(tag, '')
          marker = '</body>'
          pos = s.rfind(marker)
          if pos < 0:
              raise SystemExit('index.html tidak memiliki </body>')
          s = s[:pos] + tag + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: enable Supabase restore"
            git push
          fi
