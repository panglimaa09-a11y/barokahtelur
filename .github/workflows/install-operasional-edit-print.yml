name: Install operational edit and print fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wire operational fix into index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="operasional-sync-v70.4.9.js"></script>'
          s = s.replace(tag, '')
          marker = '</body>'
          pos = s.rfind(marker)
          if pos < 0:
              raise SystemExit('index.html tidak memiliki </body>')
          s = s[:pos] + '\n' + tag + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
      - name: Commit generated wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes needed.'
            exit 0
          fi
          git commit -m 'fix: load operational edit and print module [skip ci]'
          git push origin main
