name: Install operational edit and print fix

on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize with the other install-* workflows so concurrent
# git pushes from this workflow family never race each other.
concurrency:
  group: barokahtelur-install-fixes
  cancel-in-progress: false

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync to latest main
        # Sync FIRST, before modifying. A pull --rebase AFTER the local
        # commit conflicts when another install-* workflow already pushed
        # an index.html change (both edit near </body>). The python step
        # below is idempotent, so re-running it on a fresh base is safe.
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Wire operational fix into index
        shell: python
        run: |
          import re
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          canonical = '<script src="operasional-sync-v70.4.9.js" data-barokah-operational-sync-v7049="1"></script>'
          # 1) Hapus SEMUA tag operasional-sync-v70.4.9.js (polos maupun canonical).
          #    DIPERBAIKI 12 Okt 2026: versi lama hanya hapus tag polos exact-match,
          #    sehingga tag canonical + tag polos menumpuk ganda setiap push.
          s = re.sub(r'<script[^>]*src="operasional-sync-v70\.4\.9\.js"[^>]*>\s*</script>\s*', '', s)
          # 2) Pasang SATU tag canonical tepat sebelum </body>.
          marker = '</body>'
          pos = s.rfind(marker)
          if pos < 0:
              raise SystemExit('index.html tidak memiliki </body>')
          s = s[:pos] + '\n' + canonical + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
      - name: Commit generated wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes needed.'
            exit 0
          fi
          git commit -m 'fix: load operational edit and print module [skip ci]'
          git push origin main
