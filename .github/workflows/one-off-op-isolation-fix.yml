name: One-off operational isolation fix
on:
  push:
    branches:
      - fix/operational-stock-isolation-v70.8.3-preview
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stock isolation guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('stock-cloud-fix.js')
          s = p.read_text()
          old = "    if(!looksLikeStock)return;\n    if(node.closest('#page-operational'))return;\n    node.style.setProperty('display','none','important');"
          new = "    if(!looksLikeStock)return;\n    if(node.closest('#page-operational')){\n      node.style.setProperty('display','none','important');\n      node.setAttribute('data-stock-orphan-hidden','1');\n      return;\n    }\n    node.style.setProperty('display','none','important');"
          if old not in s:
              raise SystemExit('target guard not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patched file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-cloud-fix.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: hide stock block when operational page is active"
          git push