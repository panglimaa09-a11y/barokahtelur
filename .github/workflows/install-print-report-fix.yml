name: Install print report fix

on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize with the other install-* workflows so concurrent
# git pushes from this workflow family never race each other.
concurrency:
  group: barokahtelur-install-fixes
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to latest main
        # Sync FIRST, before modifying. A pull --rebase AFTER the local
        # commit conflicts when another install-* workflow already pushed
        # an index.html change (both edit near </body>). The python step
        # below is idempotent, so re-running it on a fresh base is safe.
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Ensure print report fix tag
        shell: python
        run: |
          from pathlib import Path

          # Keep the print-report loader tag present exactly once.
          # (The printList() repair this workflow used to do is already
          # applied in operasional.js; re-running regex surgery on every
          # push was fragile, so this workflow now only guards the tag.)
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="print-report-fix.js"></script>'
          s = s.replace(tag, '')
          marker = '</body>'
          pos = s.rfind(marker)
          if pos < 0:
              raise SystemExit('index.html tidak memiliki </body>')
          s = s[:pos] + tag + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          print('print-report-fix.js tag ensured.')

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: ensure print report fix tag [skip ci]"
            git push origin main
          fi
