name: Install print report fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair and install print report fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="print-report-fix.js"></script>'

          # Remove any previous accidental insertion, including one that may
          # have landed inside a generated print HTML string.
          s = s.replace(tag, '')

          marker = '</body>'
          pos = s.rfind(marker)
          if pos < 0:
              raise SystemExit('index.html tidak memiliki </body>')

          s = s[:pos] + tag + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          print('Print report fix installed immediately before the final </body>.')

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: place print report fix safely"
            git push
          fi
