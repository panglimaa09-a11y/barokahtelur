name: Repair index tail

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove leaked script and install runtime fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          end = s.rfind('</body></html>')
          if end < 0:
              raise SystemExit('Penutup </body></html> tidak ditemukan.')
          clean = s[:end] + '</body></html>'
          # Ensure runtime fixes are actual HTML script tags, not text inside a JS string.
          clean = clean.replace('</body></html>', '<script src="stock-cloud-fix.js"></script><script src="ui-bugfix.js"></script></body></html>', 1)
          p.write_text(clean, encoding='utf-8')
          print('index.html repaired; leaked content after the final </body></html> removed.')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: remove leaked print code from production HTML"
            git push
          fi
